# Registers the app's bundle id as a macOS App ID in Certificates, Identifiers & Profiles, which Developer ID signing
# never needed but capabilities (the passkey entitlement) and provisioning profiles do. Safe to run again: an
# existing registration is reported, not changed.
name: Register App ID

on:
  workflow_dispatch:

jobs:
  register:
    if: github.repository == 'SailfishBrowser/macOS'
    runs-on: macos-26
    environment: release
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Register the App ID
        run: |
          BUNDLE_ID="$(awk '/PRODUCT_BUNDLE_IDENTIFIER:/ { print $2; exit }' macOS/project.yml)"
          swift macOS/scripts/register-app-id.swift "$BUNDLE_ID" Sailfish
